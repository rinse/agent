[workspace]
members = [
    "crates/cli",
    "crates/agent-core",
    "crates/ports",
    "crates/adapters",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# ツール入出力は本質的に JSON（LLM / MCP）なので、コアのデータ型でも JSON 値を扱う。
# 各クレートはここからバージョンを継承する（単一のソース・オブ・トゥルース）。
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# async fn をトレイトに持たせつつ dyn 互換を保つために使用する。
async-trait = "0.1"
# 非同期ランタイム。テストの #[tokio::test] と cli の実行に使用する。
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
